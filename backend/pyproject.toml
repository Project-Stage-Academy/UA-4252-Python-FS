[tool.black]
line-length = 88
target-version = ['py310']           # adjust to your project's Python target
skip-string-normalization = true     # optional: keep single/double quotes as is

[tool.isort]
profile = "black"
line_length = 88
known_first_party = ["backend", "apps"]  # update with your top-level packages
multi_line_output = 3
include_trailing_comma = true
