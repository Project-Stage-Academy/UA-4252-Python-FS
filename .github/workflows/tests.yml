name: Tests & Coverage

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      USE_SQLITE_FOR_TESTS: "1"
      DJANGO_SETTINGS_MODULE: backend.settings
      PYTHONPATH: ${{ github.workspace }}/backend:${{ github.workspace }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip==24.0
          pip install -r backend/requirements.txt
          pip install pytest pytest-django coverage

      - name: Run tests + coverage
        run: |
          coverage run --rcfile=backend/.coveragerc -m pytest -c backend/pytest.ini backend -vv
          coverage xml --rcfile=backend/.coveragerc -o coverage.xml
          coverage report --rcfile=backend/.coveragerc

      - name: Upload to Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          flags: backend
          fail_ci_if_error: true
