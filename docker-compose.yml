services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
    stdin_open: true
    tty: true
    depends_on:
      - backend

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.backend
    container_name: backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    env_file:
      - ./backend/.env
    environment:
      # Email settings for MailHog
      - EMAIL_BACKEND=django.core.mail.backends.smtp.EmailBackend
      - EMAIL_HOST=mailhog
      - EMAIL_PORT=1025
      - EMAIL_USE_TLS=False
      - EMAIL_HOST_USER=
      - EMAIL_HOST_PASSWORD=
      - DEFAULT_FROM_EMAIL=noreply@siskidomain.com
      - FRONTEND_URL=http://localhost:3000
    depends_on:
      - db
      - redis
      - es
      - mongodb

  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.backend
    container_name: celery_worker
    command: celery -A backend worker --loglevel=info
    volumes:
      - ./backend:/app
    env_file:
      - ./backend/.env
    environment:
      - EMAIL_BACKEND=django.core.mail.backends.smtp.EmailBackend
      - EMAIL_HOST=mailhog
      - EMAIL_PORT=1025
      - EMAIL_USE_TLS=False
      - DEFAULT_FROM_EMAIL=noreply@siskidomain.com
      - FRONTEND_URL=http://localhost:3000
    depends_on:
      - db
      - redis
      - backend

  db:
    image: postgres:14-alpine
    container_name: db
    ports:
      - "5432:5432"
    volumes:
      - dev-db-data:/var/lib/postgresql/data
    env_file:
      - ./backend/.env

  es:
    image: elasticsearch:8.12.0
    container_name: elastic-search
    ports:
      - "9200:9200"
    volumes:
      - es-data:/usr/share/elasticsearch/data
    env_file:
      - ./backend/.env
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=true

  mongodb:
    image: mongodb/mongodb-community-server:8.0-ubi8
    container_name: mongodb
    ports:
      - "27017:27017"
    env_file:
      - ./backend/.env
    volumes:
      - mongodb-data:/data/db

  mongo-express:
    image: mongo-express:1-20-alpine3.19
    container_name: mongo-express
    ports:
      - "8081:8081"
    env_file:
      - ./backend/.env
    environment:
      - ME_CONFIG_MONGODB_SERVER=mongodb
      - ME_CONFIG_MONGODB_PORT=27017
    depends_on:
      - mongodb

  mailhog:
    image: mailhog/mailhog:latest
    ports:
      - "1025:1025"
      - "8025:8025"

  redis:
    image: "redis:alpine"
    hostname: redis

volumes:
  dev-db-data:
  es-data:
  mongodb-data:
