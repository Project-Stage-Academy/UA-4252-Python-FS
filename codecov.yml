codecov:
  require_ci_to_pass: yes

coverage:
  precision: 2
  round: down
  range: "70...100"

  status:
    project:
      default:
        target: 80%
        threshold: 1%
    patch:
      default:
        target: 80%

fixes:
  - "backend/::"

comment:
  layout: "reach, diff, flags, files"
  behavior: default
  require_changes: false

ignore:
  - "backend/*/migrations/*"
  - "backend/*/tests/*"
  - "backend/**/test_*.py"
  - "backend/manage.py"
  - "backend/config/settings/*"
  - "backend/*/admin.py"
  - "backend/*/apps.py"
  - "backend/*/wsgi.py"
  - "backend/*/asgi.py"